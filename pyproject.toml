[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-control-plane"
description = "Local-first, event-sourced Context Fabric between your filesystem and your AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "watchdog>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["langchain-core>=0.2", "langchain-openai>=0.1", "langgraph>=0.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
dcp = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcp = ["interfaces/web/*"]

[tool.setuptools.dynamic]
version = { attr = "dcp.__version__" }
